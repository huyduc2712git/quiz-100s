<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="110" fill="#0f172a"/>
  
  <!-- Inner Vibrant Card -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid/Ring Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-dasharray="12 12"/>
  
  <!-- Top Label: GỢI Ý -->
  <text
    x="256"
    y="160"
    fill="#fdf2f8"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="44"
    font-weight="900"
    letter-spacing="10"
    text-anchor="middle"
    opacity="0.9"
  >GỢI Ý</text>
  
  <!-- Center Main Number: 100 -->
  <text
    x="256"
    y="325"
    fill="url(#textGrad)"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="160"
    font-weight="900"
    letter-spacing="2"
    text-anchor="middle"
    filter="url(#glow)"
  >100</text>
  
  <!-- Bottom Timer/Quiz Subtitle Tag -->
  <rect x="156" y="360" width="200" height="44" rx="22" fill="rgba(0,0,0,0.3)"/>
  <text
    x="256"
    y="390"
    fill="#fbcfe8"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="3"
    text-anchor="middle"
  >100 GIÂY</text>
</svg>
